name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ImpotPointGouv
      - name: Build zip
        run: |
          rm -rf ImpotPointGouv/.git ImpotPointGouv/.github ImpotPointGouv/.gitignore
          zip -r ImpotPointGouv.zip ImpotPointGouv
      - uses: softprops/action-gh-release@v2
        with:
          files: ImpotPointGouv.zip
          body: Download ImpotPointGouv.zip and unzip it into Interface/AddOns.
