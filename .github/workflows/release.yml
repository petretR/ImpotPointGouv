name: Release

# Publishes ImpotPointGouv.zip (folder already named ImpotPointGouv) whenever the version in the .toc changes.
on:
  push:
    branches: [main]
    paths: ["ImpotPointGouv.toc", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ImpotPointGouv
      - name: Read version
        id: v
        run: echo "version=$(grep -m1 '^## Version:' ImpotPointGouv/ImpotPointGouv.toc | awk '{print $3}' | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes from CHANGELOG.md
        if: steps.check.outputs.exists != 'true'
        run: |
          v="${{ steps.v.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?([ ]|$)" {on=1; next} on && /^## / {exit} on {print}' ImpotPointGouv/CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          printf '\n---\nDownload ImpotPointGouv.zip and unzip it into Interface/AddOns.\n' >> notes.md
      - name: Build zip
        if: steps.check.outputs.exists != 'true'
        run: |
          rm -rf ImpotPointGouv/.git ImpotPointGouv/.github ImpotPointGouv/.gitignore
          zip -r ImpotPointGouv.zip ImpotPointGouv
      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.exists != 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ImpotPointGouv.zip
          body_path: notes.md
